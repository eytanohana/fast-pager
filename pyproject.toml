[project]
name = "fast-pager"
version = "0.3.0"
description = "Automatic filterable, sortable, paginated query parameters for FastAPI, derived from your Pydantic models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
]

authors = [
    { name = "Eytan Ohana" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fastapi", "pagination", "filtering", "sorting", "pydantic", "mongodb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
]

[project.optional-dependencies]
# Convenience extra for running the compiled queries; the core never
# imports a driver — paginate() duck-types the collection object.
mongo = [
    "pymongo>=4.6",
]

[project.urls]
Homepage = "https://github.com/eytanohana/fast-pager"
Repository = "https://github.com/eytanohana/fast-pager"
Issues = "https://github.com/eytanohana/fast-pager/issues"

[build-system]
requires = ["uv_build>=0.9.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "mypy>=1.14",
    "httpx>=0.27",           # fastapi TestClient
    "pre-commit>=4.0",
]
docs = [
    "mike>=2.2.0",
    "zensical>=0.0.51",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=fast_pager --cov-report=term-missing"

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload"]
fail_under = 95
