name: Release - Build and Publish Package

on:
  push:
    tags:
      - "v*.*.*"   # runs only on tags like v0.1.0

env:
  UV_VERSION: "0.11.16"
  # zensical.org's mkdocs-material-compatible mike fork — not published to
  # PyPI (upstream requires installing from git; see docs/contributing/docs-site.md).
  # Pinned to a commit for reproducibility.
  MIKE_ZENSICAL_REF: "2d4ad799442f4592db8ad53b179bfb33db8c69ac"

jobs:
  check-tag-matches-version:
    name: Check tag matches package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867  # v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Verify tag == pyproject version
        env:
          tag: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(uv version --short)"
          TAG_VERSION="${tag#v}"            # v0.1.0 -> 0.1.0
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $tag does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
          echo "Tag $tag matches package version $PKG_VERSION"

  run-ci:
    name: Run CI Tests
    uses: ./.github/workflows/ci.yml    # <--- CALL reusable CI workflow

  build-and-publish:
    name: Build and Publish Package
    runs-on: ubuntu-latest
    needs: [ check-tag-matches-version, run-ci ]   # <--- WAIT for both

    environment:
      name: pypi
    permissions:
      id-token: write    # PyPI Trusted Publishing (OIDC) — no API token needed
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867  # v7
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Build package (wheel and sdist)
        run: uv build

      - name: Publish to PyPI
        run: uv publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
            --notes $'## Release Notes\nReleased on '"$(date -u +%Y-%m-%d)"$'\n\n' \
            --generate-notes

  deploy-docs:
    name: Deploy Docs (versioned)
    runs-on: ubuntu-latest
    needs: [ check-tag-matches-version, run-ci ]

    # Serialize all gh-pages pushes across workflows: a release tag and its
    # main-branch push otherwise run mike concurrently and one push loses
    # the race (non-fast-forward rejection).
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    permissions:
      contents: write   # mike pushes to gh-pages using GITHUB_TOKEN

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867  # v7
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Install docs dependencies
        run: uv sync --locked --only-group docs

      - name: Install Zensical-compatible mike
        # The "mike" entry in pyproject.toml's docs group resolves to the
        # PyPI package, which only knows how to build via mkdocs and can't
        # drive a Zensical build. Override it with squidfunk/mike, a fork
        # that shells out to `zensical build` instead (see
        # docs/contributing/docs-site.md for why this two-step install
        # exists and a link to Zensical's versioning roadmap).
        run: |
          uv pip install --python .venv \
            "mike @ git+https://github.com/squidfunk/mike.git@${{ env.MIKE_ZENSICAL_REF }}"

      - name: Configure git identity for gh-pages commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # v0.5.4 -> 0.5.4
          uv run mike deploy --push --branch gh-pages --update-aliases "$VERSION" latest
          uv run mike set-default --push --branch gh-pages latest
