name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  UV_VERSION: "0.11.16"
  # zensical.org's mkdocs-material-compatible mike fork — not published to
  # PyPI (upstream requires installing from git; see docs/contributing/docs-site.md).
  # Pinned to a commit for reproducibility.
  MIKE_ZENSICAL_REF: "2d4ad799442f4592db8ad53b179bfb33db8c69ac"

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository ${{ github.repository }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Setup uv and python
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867  # v7
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Install docs dependencies
        run: uv sync --locked --only-group docs

      - name: Build site (strict)
        run: uv run --locked --only-group docs zensical build --clean --strict

  # Versioned docs deploy to the gh-pages branch via mike (see
  # docs/contributing/docs-site.md). Pushes to main publish/update the
  # rolling "dev" version; tagged releases are handled by the
  # `deploy-docs` job in release.yml so that a version only ever ships
  # alongside its matching package release.
  deploy-dev:
    name: Deploy dev docs (main)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Shared with release.yml's deploy-docs job — serializes gh-pages
    # pushes so a release tag and its main push can't race mike deploys.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: write   # mike pushes to gh-pages using GITHUB_TOKEN
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0

      - name: Setup uv and python
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867  # v7
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Install docs dependencies
        run: uv sync --locked --only-group docs

      - name: Install Zensical-compatible mike
        # The "mike" entry in pyproject.toml's docs group resolves to the
        # PyPI package, which only knows how to build via mkdocs and can't
        # drive a Zensical build. Override it with squidfunk/mike, a fork
        # that shells out to `zensical build` instead (see
        # docs/contributing/docs-site.md for why this two-step install
        # exists and a link to Zensical's versioning roadmap).
        run: |
          uv pip install --python .venv \
            "mike @ git+https://github.com/squidfunk/mike.git@${{ env.MIKE_ZENSICAL_REF }}"

      - name: Configure git identity for gh-pages commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy dev docs
        run: uv run mike deploy --push --branch gh-pages dev
